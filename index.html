<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheryl's Florida Beach Compound</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font:22px/1.45 sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#000;flex-wrap:wrap}
h1{font-size:30px;margin:0 18px 0 0;color:#ff6b88}
.tab{background:#333;color:#fff;border:0;border-radius:10px;padding:14px 24px;font-size:24px;cursor:pointer}
.tab.on{background:#ff2d55;font-weight:bold}
#map{position:absolute;top:140px;bottom:0;left:0;right:0}
#info{position:absolute;top:154px;left:60px;z-index:1000;background:rgba(0,0,0,.8);padding:14px 20px;border-radius:12px;max-width:500px}
#info b.t{font-size:28px;color:#ff6b88}
.btn{display:inline-block;margin-top:10px;background:#ff2d55;color:#fff;padding:12px 22px;border-radius:10px;font-weight:bold;font-size:24px;text-decoration:none;border:0;cursor:pointer}
.view{display:none;position:absolute;top:140px;bottom:0;left:0;right:0;overflow:auto;padding:24px;background:#111;z-index:2000}
table{border-collapse:collapse;width:100%}td{padding:10px 14px;border-bottom:1px solid #333;vertical-align:top}td:first-child{color:#aaa;width:30%}
a{color:#6cf}.src{font-size:16px;color:#999}
.rl{font:bold 22px sans-serif;color:#ffd400;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap}
.leaflet-control-layers{font-size:20px}
.card{background:#1d1d1d;border-radius:12px;padding:16px 20px;margin:12px 0}.badge{font-size:16px;padding:4px 10px;border-radius:8px;margin-left:10px;font-weight:bold}
.ok{background:#1b7f3a}.nv{background:#b8860b}h3{color:#ffd400;font-size:30px;margin:28px 0 6px}.leaflet-tooltip{font-size:20px}
#sub{display:flex;gap:10px;padding:8px 16px;background:#1a1a1a;flex-wrap:wrap;height:52px;box-sizing:border-box;align-items:center}
.sub{background:#2a2a2a;color:#fff;border:0;border-radius:8px;padding:8px 18px;font-size:20px;cursor:pointer}.sub.on{background:#0a84ff;font-weight:bold}
.soon{opacity:.4;cursor:default}.sec{color:#888;font-size:16px;margin-left:12px;text-transform:uppercase}
header{height:88px;box-sizing:border-box;overflow-x:auto;flex-wrap:nowrap}
</style></head><body>
<header><h1>Cheryl's Florida Beach Compound</h1><span id="tabs"></span></header>
<div id="sub"></div>
<div id="map"></div><div id="info"></div><div id="dossier" class="view"></div><div id="cons" class="view"></div><div id="glob" class="view"></div>
<script src="app.js"></script></body></html>
