<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheryl's Florida Beach Compound</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">async function cons(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.s=='constraints'));location.hash='constraints';
  const el=document.getElementById('cons');el.style.display='block';
  let data=null;try{const r=await fetch('constraints/constraints.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}
  if(!data||!data.length){el.innerHTML='<h2 style="font-size:36px;color:#ff6b88">Constraints</h2><p>Constraints research is in progress and will appear here soon.</p>';return;}
  const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const g={};data.forEach(c=>(g[c.category||'Other']=g[c.category||'Other']||[]).push(c));
  el.innerHTML='<h2 style="font-size:36px;color:#ff6b88;margin:0">Constraints (all properties)</h2>'+Object.entries(g).map(([k,v])=>`<h3>${esc(k)}</h3>`+v.map(c=>{
    const ok=/^verified$/i.test(c.status||'');
    return `<div class="card"><b style="font-size:26px">${esc(c.title)}</b><span class="badge ${ok?'ok':'nv'}">${ok?'Verified':'Needs verification'}</span>
    <p><b>Rule:</b> ${esc(c.rule)}</p><p><b>Implication:</b> ${esc(c.implication)}</p>${c.notes?`<p class="src">${esc(c.notes)}</p>`:''}
    <p>${(c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a>`).join(' · ')}</p></div>`}).join('')).join('');
}
</script>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font:22px/1.45 sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#000;flex-wrap:wrap}
h1{font-size:30px;margin:0 18px 0 0;color:#ff6b88}
.tab{background:#333;color:#fff;border:0;border-radius:10px;padding:14px 24px;font-size:24px;cursor:pointer}
.tab.on{background:#ff2d55;font-weight:bold}
#map{position:absolute;top:70px;bottom:0;left:0;right:0}
#info{position:absolute;top:84px;left:60px;z-index:1000;background:rgba(0,0,0,.8);padding:14px 20px;border-radius:12px;max-width:500px}
#info b.t{font-size:28px;color:#ff6b88}
.btn{display:inline-block;margin-top:10px;background:#ff2d55;color:#fff;padding:12px 22px;border-radius:10px;font-weight:bold;font-size:24px;text-decoration:none;border:0;cursor:pointer}
#dossier,#cons{display:none;position:absolute;top:70px;bottom:0;left:0;right:0;overflow:auto;padding:24px;background:#111;z-index:2000}
table{border-collapse:collapse;width:100%}td{padding:10px 14px;border-bottom:1px solid #333;vertical-align:top}td:first-child{color:#aaa;width:30%}
a{color:#6cf}.src{font-size:16px;color:#999}
.rl{font:bold 22px sans-serif;color:#ffd400;text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap}
.leaflet-control-layers{font-size:20px}
.card{background:#1d1d1d;border-radius:12px;padding:16px 20px;margin:12px 0}.badge{font-size:16px;padding:4px 10px;border-radius:8px;margin-left:10px;font-weight:bold}
.ok{background:#1b7f3a}.nv{background:#b8860b}h3{color:#ffd400;font-size:30px;margin:28px 0 6px}.leaflet-tooltip{font-size:20px}
</style></head><body>
<header><h1>Cheryl's Florida Beach Compound</h1><span id="tabs"></span></header>
<div id="map"></div><div id="info"></div><div id="dossier"></div><div id="cons"></div>
<script>
const COL={wood:'#2e8b57',scrub:'#6b8e23',wetland:'#3cb371',beach:'#f4d58d',water:'#1e90ff',coastline:'#00e5ff'};
const map=L.map('map',{maxZoom:21});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri World Imagery',maxZoom:21,maxNativeZoom:19}).addTo(map);
const st=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:21,maxNativeZoom:19});
L.control.scale().addTo(map);
let groups=[],ctl=null;const J=u=>fetch(u).then(r=>r.json());
const money=n=>'$'+Number(n).toLocaleString();
async function show(slug){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.s==slug));
  location.hash=slug; const d=`properties/${slug}/`;
  const [par,nb,rd,cx,f]=await Promise.all(['parcel.geojson','neighbors.geojson','roads.geojson','context.geojson','facts.json'].map(x=>J(d+x)));
  groups.forEach(g=>map.removeLayer(g)); if(ctl) map.removeControl(ctl);
  const gCx=L.geoJSON(cx,{style:x=>({color:COL[x.properties.kind],weight:x.properties.kind=='coastline'?4:1,fillOpacity:.3}),onEachFeature:(x,l)=>l.bindTooltip(x.properties.kind=='coastline'?'Gulf shoreline':x.properties.kind)});
  const gNb=L.geoJSON(nb,{style:{color:'#fff',weight:1.5,fillOpacity:0},onEachFeature:(x,l)=>l.bindTooltip(`${x.properties.SITUS_ADDRESS||''}<br>Parcel ${x.properties.PARID} · ${(+x.properties.LAND_ACREAGE_CAMA).toFixed(2)} ac`)});
  const gRd=L.layerGroup(),seen={};
  L.geoJSON(rd,{style:{color:'#ffd400',weight:4,opacity:.8},onEachFeature:(x,l)=>{l.bindTooltip(x.properties.name);const n=x.properties.name;
    if(n&&!seen[n]){seen[n]=1;const c=l.getBounds().getCenter();L.marker(c,{icon:L.divIcon({className:'',html:`<div class="rl">${n}</div>`,iconSize:[0,0]})}).addTo(gRd);}}}).addTo(gRd);
  const gP=L.geoJSON(par,{style:{color:'#ff2d55',weight:6,fillColor:'#ff2d55',fillOpacity:.18}}).bindTooltip(`${f.label} — parcel ${f.parcel_id}`);
  groups=[gCx,gNb,gRd,gP]; groups.forEach(g=>g.addTo(map));
  ctl=L.control.layers({'Satellite':sat,'Street':st},{'Subject parcel':gP,'Neighbor parcels':gNb,'Roads':gRd,'Shoreline / vegetation (OSM)':gCx},{collapsed:false}).addTo(map);
  map.fitBounds(gP.getBounds(),{padding:[200,200],maxZoom:19});
  const p=f.pao;
  document.getElementById('info').innerHTML=`<b class="t">${f.label}</b><br>${f.address}<br>${f.county} · Parcel <b>${f.parcel_id}</b><br>
   Lot <b>${f.listed_acres}</b> (PAO ${p.acres} ac) · List <b>${f.list_price}</b><br>Listing: ${f.agent.name}, MLS ${f.mls}<br>
   <span style="color:#7CFC00">Boundary: ${f.boundary}</span><br><button class="btn" onclick="dos(1)">Property Dossier →</button>`;
  const a=f.agent;
  document.getElementById('dossier').innerHTML=`<h2 style="font-size:36px;color:#ff6b88;margin:0">${f.label} – Property Dossier</h2>
   <button class="btn" onclick="dos(0)">← Back to Map</button><table>
   <tr><td>Address</td><td>${f.address}</td></tr><tr><td>MLS</td><td>${f.mls}</td></tr>
   <tr><td>County</td><td>${f.county}</td></tr><tr><td>Neighborhood</td><td>${f.neighborhood}</td></tr>
   <tr><td>List price</td><td>${f.list_price}</td></tr>
   <tr><td>Lot size</td><td>${f.listed_acres} listed · ${p.acres} ac / ${Number(p.sqft).toLocaleString()} sq ft <span class="src">(PAO)</span></td></tr>
   <tr><td>Parcel ID</td><td>${f.parcel_id} <span class="src">(PAO)</span></td></tr>
   <tr><td>Lot dimensions</td><td>${p.frontage_ft} ft frontage × ${p.depth_ft} ft depth <span class="src">(PAO land record)</span></td></tr>
   <tr><td>Legal</td><td>${p.legal} <span class="src">(PAO)</span></td></tr>
   <tr><td>Waterfront</td><td>${f.waterfront} (PAO flag: ${p.waterfront})</td></tr>
   <tr><td>Zoning / use</td><td>${p.zoning} · ${p.use} <span class="src">(PAO)</span></td></tr>
   <tr><td>${p.roll_year} just value</td><td>${money(p.just_value)} <span class="src">(PAO)</span></td></tr>
   <tr><td>Listing agent</td><td>${a.name} · <a href="${a.url}" target="_blank">${a.url.replace('https://','')}</a> · <a href="tel:+1${a.phone.replace(/\D/g,'')}">${a.phone}</a></td></tr>
   </table><p class="src">${f.sources}</p>`;
}
function dos(on){document.getElementById('cons').style.display='none';document.getElementById('dossier').style.display=on?'block':'none'}
J('properties.json').then(idx=>{const t=document.getElementById('tabs');
  idx.forEach(i=>{const b=document.createElement('button');b.className='tab';b.textContent=i.label;b.dataset.s=i.slug;b.onclick=()=>{dos(0);show(i.slug)};t.appendChild(b)});
  const c=document.createElement('button');c.className='tab';c.textContent='Constraints';c.dataset.s='constraints';c.onclick=cons;t.appendChild(c);
  const h=location.hash.slice(1);if(h=='constraints'){cons();return;}show(idx.find(i=>i.slug==h)?h:idx[0].slug);});
async function cons(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.s=='constraints'));location.hash='constraints';
  const el=document.getElementById('cons');el.style.display='block';
  let data=null;try{const r=await fetch('constraints/constraints.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}
  if(!data||!data.length){el.innerHTML='<h2 style="font-size:36px;color:#ff6b88">Constraints</h2><p>Constraints research is in progress and will appear here soon.</p>';return;}
  const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const g={};data.forEach(c=>(g[c.category||'Other']=g[c.category||'Other']||[]).push(c));
  el.innerHTML='<h2 style="font-size:36px;color:#ff6b88;margin:0">Constraints (all properties)</h2>'+Object.entries(g).map(([k,v])=>`<h3>${esc(k)}</h3>`+v.map(c=>{
    const ok=/^verified$/i.test(c.status||'');
    return `<div class="card"><b style="font-size:26px">${esc(c.title)}</b><span class="badge ${ok?'ok':'nv'}">${ok?'Verified':'Needs verification'}</span>
    <p><b>Rule:</b> ${esc(c.rule)}</p><p><b>Implication:</b> ${esc(c.implication)}</p>${c.notes?`<p class="src">${esc(c.notes)}</p>`:''}
    <p>${(c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label||s.url)}</a>`).join(' · ')}</p></div>`}).join('')).join('');
}
</script></body></html>
